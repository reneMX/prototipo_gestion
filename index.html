  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tnamese */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"dfd7edec-4065-4eda-bf4a-3fd11af6d075\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"7db21bd9-db10-4106-9c5a-d009fa03f18e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"eb9944bd-2fae-4962-8968-b0dcb2824c79\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"0e3643d6-6b0f-4004-b8a3-45e10fdc78aa\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"7a8416e4-387e-45b2-bd2a-021b53e49e7c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"4ac6e306-0810-49a5-a676-f4923b8746f3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"5f65d32b-4d52-4d3e-b8cc-9081d7d97a27\"><\u002Fscript>\n<script src=\"ac46909c-9a75-47fc-901f-af4a2918c987\"><\u002Fscript>\n<style>\nhtml,body{margin:0;background:var(--color-surface);color:var(--color-text);font-family:var(--font-body);-webkit-tap-highlight-color:transparent}\na{color:var(--color-accent-700)}a:hover{color:var(--color-accent-900)}\nbutton{font-family:inherit;color:inherit}\n@keyframes pvScan{0%{top:12%}50%{top:82%}100%{top:12%}}\n@keyframes pvUp{from{transform:translateY(100%)}to{transform:none}}\n@keyframes pvFade{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100dvh;display:grid;place-items:center\">\n<div data-screen-label=\"Prototipo v4\" style=\"position:relative;overflow:hidden;width:min(100vw,400px);height:min(100dvh,840px);background:var(--color-bg);display:flex;flex-direction:column;border:1px solid var(--color-divider);box-shadow:var(--shadow-lg)\">\n\n  <sc-if value=\"{{ showHeader }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:8px;border-bottom:1px solid var(--color-divider)\">\n      <button sc-camel-on-click=\"{{ goBack }}\" aria-label=\"Atrás\" style=\"all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center\">\n        <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n      <strong style=\"text-align:center;font-family:var(--font-heading);font-size:20px;letter-spacing:.02em\">{{ headerTitle }}<\u002Fstrong>\n      <span><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"flex:1;overflow-y:auto;display:flex;flex-direction:column\">\n\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding:20px 18px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\">\n          <strong style=\"font-family:var(--font-heading);font-size:26px;letter-spacing:.02em\">PrecioVecino<\u002Fstrong>\n          <span class=\"tag tag-neutral\" style=\"white-space:nowrap\">Súper Centro · Col. Centro<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <h1 style=\"margin:0;font-family:var(--font-heading);font-size:38px;line-height:1;text-wrap:pretty\">¿No sabes cuál llevar?<\u002Fh1>\n          <p style=\"margin:0;font-size:15px;color:var(--color-neutral-800);text-wrap:pretty\">Escanea 2 productos y te decimos cuál es mejor para ti y tu bolsillo, con precios que actualizan tus vecinos esta semana.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--color-divider)\">\n          <span style=\"width:8px;height:8px;border-radius:50%;background:var(--color-accent)\"><\u002Fspan>\n          <span style=\"font-size:13px;text-wrap:pretty\"><strong>Esta semana en Súper Centro:<\u002Fstrong> 38 vecinos confirmaron 214 precios. El último, hace 12 min.<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ svBanner }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:10px 4px 10px 12px;border:1px solid var(--color-accent);background:var(--color-accent-100)\">\n            <button sc-camel-on-click=\"{{ goEncuesta }}\" style=\"all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px\">\n              <strong style=\"font-size:14px\">¿Ya probaste la app? Cuéntanos qué te pareció<\u002Fstrong>\n              <span style=\"font-size:13px;color:var(--color-accent-900)\">Encuesta de 1 minuto →<\u002Fspan>\n            <\u002Fbutton>\n            <button sc-camel-on-click=\"{{ hideBanner }}\" aria-label=\"Cerrar aviso\" style=\"all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ goScan }}\" class=\"btn btn-primary btn-block blueprint\" style=\"height:56px;font-size:17px;display:flex;gap:10px;justify-content:center;align-items:center\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M11 8v8M15 8v8M18 8v8\"><\u002Fpath><\u002Fsvg>\n          Escanear productos\n        <\u002Fbutton>\n        <sc-if value=\"{{ listHas }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ goLista }}\" style=\"all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px;border:1px solid var(--color-accent)\">\n            <span style=\"display:flex;flex-direction:column;gap:2px\"><strong style=\"font-size:15px\">Mi lista · {{ sumCount }} productos<\u002Fstrong><span style=\"font-size:13px;color:var(--color-neutral-800)\">Total {{ sumTotal }} · ahorras {{ sumSave }}<\u002Fspan><\u002Fspan>\n            <span style=\"font-size:13px;color:var(--color-accent-700);white-space:nowrap\">Ver resumen →<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-if>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n          <strong style=\"font-family:var(--font-heading);font-size:20px\">Ofertas reportadas cerca<\u002Fstrong>\n          <button sc-camel-on-click=\"{{ goOfertas }}\" style=\"all:unset;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--color-accent-700);text-decoration:underline;padding:8px 0\">Ver todas<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-for list=\"{{ deals }}\" as=\"d\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ goOfertas }}\" style=\"all:unset;cursor:pointer;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:8px;border:1px solid var(--color-divider)\">\n            <div style=\"width:52px;height:52px;background:var(--color-neutral-100);display:grid;place-items:center;overflow:hidden\"><img src=\"{{ d.img }}\" alt=\"\" style=\"max-width:100%;max-height:100%;object-fit:contain\"><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><strong style=\"font-size:14px;line-height:1.3\">{{ d.name }}<\u002Fstrong><span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ d.store }} · {{ d.dist }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:2px\"><strong style=\"font-size:16px\">{{ d.now }}<\u002Fstrong><span style=\"font-size:12px;text-decoration:line-through;color:var(--color-neutral-700)\">{{ d.old }}<\u002Fspan><\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isScan }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:16px 18px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <strong style=\"font-family:var(--font-heading);font-size:24px;line-height:1.05\">Toma foto de los productos que dudas<\u002Fstrong>\n          <span style=\"font-size:13px;color:var(--color-neutral-800);text-wrap:pretty\">Una foto con 2 a 5 productos de frente, o una por producto. Si quieres ingredientes exactos, agrega la etiqueta trasera. Máximo 4 fotos.<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ noPhotos }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"border:1px dashed var(--color-neutral-500);padding:22px 14px;display:grid;place-items:center;gap:6px;text-align:center\">\n            <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n            <span style=\"font-size:13px;color:var(--color-neutral-700)\">Aún no hay fotos<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasPhotos }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px\">\n            <sc-for list=\"{{ photos }}\" as=\"f\" hint-placeholder-count=\"1\">\n              <div style=\"position:relative;aspect-ratio:3/4;border:1px solid var(--color-divider);overflow:hidden;background:var(--color-neutral-100)\">\n                <img src=\"{{ f.url }}\" alt=\"Foto tomada\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n                <button sc-camel-on-click=\"{{ f.remove }}\" aria-label=\"Quitar foto\" style=\"all:unset;cursor:pointer;position:absolute;top:0;right:0;width:32px;height:32px;display:grid;place-items:center;background:var(--color-bg)\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n          <label class=\"btn btn-secondary\" style=\"min-height:52px;display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n            Tomar foto\n            <input type=\"file\" accept=\"image/*\" capture=\"environment\" sc-camel-on-change=\"{{ onFiles }}\" style=\"display:none\">\n          <\u002Flabel>\n          <label class=\"btn btn-secondary\" style=\"min-height:52px;display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\"><\u002Frect><circle cx=\"9\" cy=\"9\" r=\"2\"><\u002Fcircle><path d=\"m21 15-5-5L5 21\"><\u002Fpath><\u002Fsvg>\n            Galería\n            <input type=\"file\" accept=\"image/*\" multiple=\"\" sc-camel-on-change=\"{{ onFiles }}\" style=\"display:none\">\n          <\u002Flabel>\n        <\u002Fdiv>\n        <sc-if value=\"{{ analyzing }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:relative;overflow:hidden;padding:14px;border:1px solid var(--color-accent);background:var(--color-accent-100);font-size:14px\">{{ scanLine }}Reconociendo productos en tus fotos…<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasAiErr }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border:1px dashed var(--color-neutral-500);padding:12px;display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font-size:14px;text-wrap:pretty\">{{ aiErr }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ useDemo }}\" class=\"btn btn-secondary\" style=\"min-height:44px\">Usar productos de ejemplo<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <span style=\"font-size:12px;color:var(--color-neutral-700);text-wrap:pretty\">La app es una ayuda: la etiqueta y tu médico tienen la última palabra. Los ingredientes estimados por IA pueden no ser exactos.<\u002Fspan>\n        <button sc-camel-on-click=\"{{ toggleDemo }}\" style=\"all:unset;cursor:pointer;font-size:13px;color:var(--color-accent-700);text-decoration:underline;padding:6px 0;align-self:flex-start\">{{ demoLabel }}<\u002Fbutton>\n        <sc-if value=\"{{ showDemo }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n              <sc-for list=\"{{ scanCats }}\" as=\"c\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ c.pick }}\" style=\"all:unset;cursor:pointer;padding:8px 12px;font-size:13px;border:1px solid {{ c.border }};background:{{ c.bg }};white-space:nowrap\">{{ c.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px\">\n              <sc-for list=\"{{ shelf }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ p.scan }}\" style=\"all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid {{ p.border }};opacity:{{ p.op }}\">\n                  <div style=\"height:92px;background:var(--color-neutral-100);display:grid;place-items:center;overflow:hidden\"><img src=\"{{ p.img }}\" alt=\"\" style=\"max-width:100%;max-height:100%;object-fit:contain\"><\u002Fdiv>\n                  <strong style=\"font-size:12px;line-height:1.25\">{{ p.short }}<\u002Fstrong>\n                  <span style=\"font-size:11px;color:var(--color-accent-700)\">{{ p.state }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n          <strong style=\"font-family:var(--font-heading);font-size:18px\">Para comparar ({{ count }}/5)<\u002Fstrong>\n          <span style=\"font-size:12px;color:var(--color-neutral-700)\">mínimo 2<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ noneScanned }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"border:1px dashed var(--color-neutral-500);padding:14px;font-size:13px;color:var(--color-neutral-700);text-align:center\">Aún no escaneas nada.<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ tray }}\" as=\"p\" hint-placeholder-count=\"0\">\n          <div style=\"display:grid;grid-template-columns:40px 1fr auto 44px;gap:10px;align-items:center;padding:6px 0 6px 8px;border:1px solid var(--color-divider)\">\n            <div style=\"width:40px;height:40px;background:var(--color-neutral-100);display:grid;place-items:center;overflow:hidden\"><img src=\"{{ p.img }}\" alt=\"\" style=\"max-width:100%;max-height:100%;object-fit:contain\"><\u002Fdiv>\n            <span style=\"display:flex;flex-direction:column;min-width:0\"><strong style=\"font-size:13px;line-height:1.3\">{{ p.short }}<\u002Fstrong><span style=\"font-size:11px;color:var(--color-neutral-700)\">{{ p.srcTag }}<\u002Fspan><\u002Fspan>\n            <strong style=\"font-size:14px;white-space:nowrap\">{{ p.priceLabel }}<\u002Fstrong>\n            <button sc-camel-on-click=\"{{ p.remove }}\" aria-label=\"Quitar\" style=\"all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n            <sc-if value=\"{{ p.needsPrice }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"grid-column:1/-1;padding:0 8px 6px 0;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center\">\n                <span style=\"font-size:12px\">Precio en el anaquel<\u002Fspan>\n                <input class=\"input\" inputmode=\"decimal\" placeholder=\"$ 0.00\" value=\"{{ p.draft }}\" sc-camel-on-change=\"{{ p.onPrice }}\" style=\"min-height:40px;font-size:15px\">\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCriteria }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:16px 18px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;gap:8px;overflow-x:auto\">\n          <sc-for list=\"{{ tray }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"flex:0 0 auto;display:flex;flex-direction:column;gap:4px;align-items:center;width:88px\">\n              <div style=\"width:64px;height:72px;background:var(--color-neutral-100);display:grid;place-items:center;overflow:hidden\"><img src=\"{{ p.img }}\" alt=\"\" style=\"max-width:100%;max-height:100%;object-fit:contain\"><\u002Fdiv>\n              <span style=\"font-size:11px;text-align:center;line-height:1.2\">{{ p.short }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <h2 style=\"margin:0;font-family:var(--font-he <span class=\"tag tag-neutral\" style=\"white-space:nowrap\">{{ a.level }}<\u002Fspan><\u002Fdiv>\n                <span style=\"font-size:14px;text-wrap:pretty\"><strong>¿Qué es?<\u002Fstrong> {{ a.what }}<\u002Fspan>\n                <span style=\"font-size:14px;text-wrap:pretty\"><strong>Lo que dicen los estudios:<\u002Fstrong> {{ a.study }}<\u002Fspan>\n                <span style=\"font-size:14px;text-wrap:pretty\"><strong>Tómalo en cuenta si<\u002Fstrong> {{ a.who }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ ingClean }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border:1px dashed var(--color-neutral-500);padding:14px;font-size:14px;text-wrap:pretty\">No encontramos ingredientes que suelan generar dudas en este producto.<\u002Fdiv>\n            <\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ toggleFull }}\" style=\"all:unset;cursor:pointer;font-size:13px;color:var(--color-accent-700);text-decoration:underline;padding:6px 0\">{{ fullLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ showFull }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size:13px;color:var(--color-neutral-800);text-wrap:pretty\">{{ fullList }}<\u002Fspan>\n            <\u002Fsc-if>\n            <span style=\"font-size:12px;color:var(--color-neutral-700);text-wrap:pretty\">{{ ingSrc }} Información orientativa, no es consejo médico. “Evidencia” indica qué tan sólidos son los estudios hoy.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isLista }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:20px 18px;display:flex;flex-direction:column;gap:16px\">\n        <strong style=\"font-family:var(--font-heading);font-size:28px\">Mi lista<\u002Fstrong>\n        <sc-if value=\"{{ listEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"border:1px dashed var(--color-neutral-500);padding:20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <span style=\"font-size:15px;text-wrap:pretty\">Tu lista está vacía. Compara productos y elige uno para que aparezca aquí con su resumen: lo bueno, lo que conviene vigilar y cuánto ahorras.<\u002Fspan>\n            <button sc-camel-on-click=\"{{ goScan }}\" class=\"btn btn-primary blueprint\" style=\"min-height:48px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Empezar a comparar<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ listHas }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <div style=\"display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--color-divider)\">\n              <div style=\"padding:12px 8px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--color-divider)\"><span style=\"font-size:12px\">Total estimado<\u002Fspan><strong style=\"font-family:var(--font-heading);font-size:26px;line-height:1\">{{ sumTotal }}<\u002Fstrong><\u002Fdiv>\n              <div style=\"padding:12px 8px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--color-divider)\"><span style=\"font-size:12px\">Ahorro<\u002Fspan><strong style=\"font-family:var(--font-heading);font-size:26px;line-height:1;color:var(--color-accent-700)\">{{ sumSave }}<\u002Fstrong><\u002Fdiv>\n              <div style=\"padding:12px 8px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:12px\">Calidad prom.<\u002Fspan><strong style=\"font-family:var(--font-heading);font-size:26px;line-height:1\">{{ sumRating }}<\u002Fstrong><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-size:12px;color:var(--color-neutral-700);margin-top:-8px\">El ahorro se calcula contra la opción que rinde menos de cada comparación.<\u002Fspan>\n            <sc-if value=\"{{ hasBest }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"blueprint\" style=\"padding:12px;display:flex;flex-direction:column;gap:4px\">\n                <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                <span style=\"font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--color-accent-700)\">Consejo de la comunidad<\u002Fspan>\n                <span style=\"font-size:14px;text-wrap:pretty\">{{ bestText }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <strong style=\"font-family:var(--font-heading);font-size:20px\">Productos ({{ sumCount }})<\u002Fstrong>\n            <sc-for list=\"{{ listRows }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <div style=\"border:1px solid var(--color-divider);padding:10px;display:flex;flex-direction:column;gap:8px\">\n                <div style=\"display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center\">\n                  <div style=\"width:52px;height:60px;background:var(--color-neutral-100);display:grid;place-items:center;overflow:hidden\"><img src=\"{{ r.img }}\" alt=\"\" style=\"max-width:100%;max-height:100%;object-fit:contain\"><\u002Fdiv>\n                  <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><strong style=\"font-size:14px;line-height:1.3\">{{ r.short }}<\u002Fstrong><span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ r.sizeLabel }}<\u002Fspan><span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ r.vsLabel }}<\u002Fspan><\u002Fspan>\n                  <strong style=\"font-size:16px;white-space:nowrap\">{{ r.lineTotal }}<\u002Fstrong>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                  <span class=\"tag tag-accent\" style=\"white-space:nowrap\"><span>{{ r.goodLabel }}<\u002Fspan><\u002Fspan>\n                  <span class=\"tag tag-neutral\" style=\"white-space:nowrap\"><span>{{ r.badLabel }}<\u002Fspan><\u002Fspan>\n                  <sc-if value=\"{{ r.web }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag tag-outline\" style=\"white-space:nowrap\">Dato de la web<\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;align-items:center\">\n                  <div style=\"display:flex;align-items:center;border:1px solid var(--color-divider)\">\n                    <button sc-camel-on-click=\"{{ r.dec }}\" aria-label=\"Menos\" style=\"all:unset;cursor:pointer;width:44px;height:40px;display:grid;place-items:center;font-size:18px\">−<\u002Fbutton>\n                    <span style=\"min-width:28px;text-align:center;font-weight:700\">{{ r.qty }}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ r.inc }}\" aria-label=\"Más\" style=\"all:unset;cursor:pointer;width:44px;height:40px;display:grid;place-items:center;font-size:18px\">+<\u002Fbutton>\n                  <\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ r.remove }}\" style=\"all:unset;cursor:pointer;font-size:13px;text-decoration:underline;padding:10px 4px;color:var(--color-neutral-800)\">Quitar<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <strong style=\"font-family:var(--font-heading);font-size:20px\">Lo bueno de tu lista<\u002Fstrong>\n            <div style=\"display:flex;flex-direction:column;border-top:1px solid var(--color-divider)\">\n              <sc-for list=\"{{ goods }}\" as=\"g\" hint-placeholder-count=\"3\">\n                <div style=\"display:grid;grid-template-columns:20px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--color-divider);font-size:14px\">\n                  <span style=\"color:var(--color-accent-700)\">✓<\u002Fspan>\n                  <span style=\"text-wrap:pretty\">{{ g.text }} <span style=\"color:var(--color-neutral-700);font-size:12px\">· {{ g.who }}<\u002Fspan><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ hasBads }}\" hint-placeholder-val=\"{{ false }}\">\n              <strong style=\"font-family:var(--font-heading);font-size:20px\">Lo que conviene vigilar<\u002Fstrong>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ bads }}\" as=\"b\" hint-placeholder-count=\"2\">\n              <div style=\"border:1px solid var(--color-divider);padding:10px;display:flex;flex-direction:column;gap:4px\">\n                <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:baseline\"><strong style=\"font-size:14px;flex:1;min-width:0\">{{ b.title }}<\u002Fstrong><span class=\"tag tag-neutral\" style=\"white-space:nowrap\">{{ b.level }}<\u002Fspan><\u002Fdiv>\n                <span style=\"font-size:13px;text-wrap:pretty\">{{ b.study }}<\u002Fspan>\n                <span style=\"font-size:12px;color:var(--color-neutral-700)\">En: {{ b.who }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-if value=\"{{ hasToVal }}\" hint-placeholder-val=\"{{ false }}\">\n              <strong style=\"font-family:var(--font-heading);font-size:20px\">Ayuda a tus vecinos<\u002Fstrong>\n              <span style=\"font-size:13px;color:var(--color-neutral-800);margin-top:-10px\">Estos datos vienen de la web y nadie los ha confirmado en tu zona.<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ toVal }}\" as=\"v\" hint-placeholder-count=\"0\">\n              <div style=\"display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px;border:1px dashed var(--color-neutral-500)\">\n                <span style=\"font-size:13px\"><strong>{{ v.short }}<\u002Fstrong> · precio {{ v.priceLabel }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ v.validate }}\" class=\"btn btn-secondary\" style=\"min-height:40px;white-space:nowrap\">Validar (+10)<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <button sc-camel-on-click=\"{{ keepComparing }}\" class=\"btn btn-primary btn-block blueprint\" style=\"min-height:50px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Comparar otro producto<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goEncuesta }}\" class=\"btn btn-secondary btn-block\" style=\"min-height:48px\">¿Terminaste? Danos tu opinión (1 min)<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isOfertas }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:20px 18px;display:flex;flex-direction:column;gap:12px\">\n        <strong style=\"font-family:var(--font-heading);font-size:28px\">Ofertas de la comunidad<\u002Fstrong>\n        <span style=\"font-size:13px;color:var(--color-neutral-700)\">Confirma si sigue la oferta: así se mantiene al día para todos.<\u002Fspan>\n        <sc-for list=\"{{ deals }}\" as=\"d\" hint-placeholder-count=\"3\">\n          <div style=\"border:1px solid var(--color-divider);padding:12px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;justify-content:space-between;font-size:12px;color:var(--color-neutral-700)\"><span>@{{ d.user }} · {{ d.ago }}<\u002Fspan><span>{{ d.dist }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center\">\n              <div style=\"width:56px;height:60px;background:var(--color-neutral-100);display:grid;place-items:center;overflow:hidden\"><img src=\"{{ d.img }}\" alt=\"\" style=\"max-width:100%;max-height:100%;object-fit:contain\"><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><strong style=\"font-size:14px;line-height:1.3\">{{ d.name }}<\u002Fstrong><span style=\"font-size:13px\">{{ d.store }}<\u002Fspan><span style=\"font-size:12px;color:var(--color-accent-700)\">{{ d.reason }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;align-items:flex-end\"><strong style=\"font-family:var(--font-heading);font-size:24px\">{{ d.now }}<\u002Fstrong><span style=\"font-size:13px;text-decoration:line-through;color:var(--color-neutral-700)\">{{ d.old }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n              <button sc-camel-on-click=\"{{ d.yes }}\" class=\"btn btn-secondary\" style=\"min-height:44px;background:{{ d.yesBg }}\">{{ d.yesLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ d.no }}\" class=\"btn btn-ghost\" style=\"min-height:44px;background:{{ d.noBg }}\">{{ d.noLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isEncuesta }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:20px 18px;display:flex;flex-direction:column;gap:22px\">\n        <sc-if value=\"{{ svSent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"blueprint\" style=\"padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <strong style=\"font-family:var(--font-heading);font-size:28px;line-height:1\">¡Gracias por tu opinión!<\u002Fstrong>\n            <span style=\"font-size:15px;text-wrap:pretty\">Tus respuestas nos ayudan a decidir qué mejorar primero.<\u002Fspan>\n            <button sc-camel-on-click=\"{{ goHome }}\" class=\"btn btn-primary blueprint\" style=\"min-height:48px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Volver al inicio<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ svOpen }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:22px\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <strong style=\"font-family:var(--font-heading);font-size:28px;line-height:1\">Tu opinión (1 min)<\u002Fstrong>\n              <span style=\"font-size:14px;color:var(--color-neutral-800)\">6 preguntas. Las últimas dos son opcionales.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <strong style=\"font-size:16px;text-wrap:pretty\">1. En la tienda, ¿con qué te quedarías más tranquilo para decidir cuál comprar?<\u002Fstrong>\n              <span style=\"font-size:13px;color:var(--color-neutral-700)\">Elige hasta 2<\u002Fspan>\n              <sc-for list=\"{{ svQ1 }}\" as=\"o\" hint-placeholder-count=\"5\">\n                <button sc-camel-on-click=\"{{ o.toggle }}\" style=\"all:unset;cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;padding:12px;border:1px solid {{ o.border }};background:{{ o.bg }}\">\n                  <span style=\"width:20px;height:20px;border:1px solid {{ o.boxBorder }};background:{{ o.boxBg }};color:var(--color-bg);display:grid;place-items:center;font-size:13px\">{{ o.mark }}<\u002Fspan>\n                  <span style=\"font-size:15px\">{{ o.label }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <strong style=\"font-size:16px;text-wrap:pretty\">2. ¿Qué tanto le crees a la recomendación “Te conviene”?<\u002Fstrong>\n              <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:6px\">\n                <sc-for list=\"{{ svQ2 }}\" as=\"o\" hint-placeholder-count=\"5\">\n                  <button sc-camel-on-click=\"{{ o.pick }}\" style=\"all:unset;cursor:pointer;height:48px;display:grid;place-items:center;font-family:var(--font-heading);font-size:22px;border:1px solid {{ o.border }};background:{{ o.bg }}\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:12px;color:var(--color-neutral-700)\"><span>Nada<\u002Fspan><span>Totalmente<\u002Fspan><\u002Fdiv>\n              <textarea class=\"input\" rows=\"2\" placeholder=\"¿Por qué?\" value=\"{{ svWhy }}\" sc-camel-on-change=\"{{ onSvWhy }}\" style=\"font-size:15px;resize:vertical;font-family:inherit\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <strong style=\"font-size:16px;text-wrap:pretty\">3. Si la usaras de verdad, ¿confirmarías o corregirías precios para ayudar a otros?<\u002Fstrong>\n              <sc-for list=\"{{ svQ3 }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ o.pick }}\" style=\"all:unset;cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;padding:12px;border:1px solid {{ o.border }};background:{{ o.bg }}\">\n                  <span style=\"width:20px;height:20px;border-radius:50%;border:1px solid {{ o.boxBorder }};background:{{ o.boxBg }}\"><\u002Fspan>\n                  <span style=\"font-size:15px\">{{ o.label }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <strong style=\"font-size:16px;text-wrap:pretty\">4. ¿Qué tan útil sería esta app en tus compras reales?<\u002Fstrong>\n              <sc-for list=\"{{ svQU }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ o.
